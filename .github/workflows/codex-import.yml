name: reconstruct-codex-ac52494

on:
  push:
    branches:
      - transfer/codex-ac52494-import

permissions:
  contents: write

jobs:
  reconstruct:
    if: ${{ !contains(github.event.head_commit.message, '[codex-import-final]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified Codex snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat .codex-import/part-* > /tmp/ac52494.patch.xz.b64
          base64 -d /tmp/ac52494.patch.xz.b64 > /tmp/ac52494.patch.xz
          echo "a1b2a59519403be365bfee6ef8ac689ebc6c7e06853a17b85040fc5b67740dd9  /tmp/ac52494.patch.xz" | sha256sum -c -
          xz -dc /tmp/ac52494.patch.xz > /tmp/ac52494.patch
          echo "a7c0934fcdf6760fa8709dc35688b3279c03e21e70db400797182f4e53cfd503  /tmp/ac52494.patch" | sha256sum -c -
          git apply --index --binary /tmp/ac52494.patch
          git rm -r .codex-import .github/workflows/codex-import.yml
          tree="$(git write-tree)"
          test "$tree" = "836050e99763cbbbdf9ca8929627ac09ff35be86"
          git config user.name "LUDYS Codex Preservation"
          git config user.email "ludys-preservation@users.noreply.github.com"
          git commit -m "chore(preservation): reconstruct Codex ac52494 tree [codex-import-final]"
          git push origin HEAD:transfer/codex-ac52494-import
